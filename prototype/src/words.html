<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arth – Saved words</title>
<style>
  :root { color-scheme: light dark; --fg: #1d2129; --muted: #5b6270; --bg: #f4f5f8; --panel: #fff; --line: rgba(20, 24, 33, 0.14); --line-strong: rgba(20, 24, 33, 0.32); --accent: #3451d1; --on-accent: #fff; --danger: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8ee; --muted: #a3a9b6; --bg: #17181d; --panel: #1e2026; --line: rgba(255, 255, 255, 0.14); --line-strong: rgba(255, 255, 255, 0.32); --accent: #8fa2ff; --on-accent: #10131a; --danger: #f2b8b5; } }
  * { border-radius: 0; }
  body { margin: 0; padding: 32px 16px 48px; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 760px; margin: 0 auto; }
  .brand { font-weight: 700; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .sub a { color: var(--accent); }
  .prefs, .entry { background: var(--panel); border: 1px solid var(--line); }
  .prefs { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 16px; padding: 14px 16px; border-top: 2px solid var(--accent); }
  label { font-size: 13px; color: var(--muted); }
  select, input[type="search"], textarea, button { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); }
  select { padding: 5px 8px; margin-left: 8px; font-size: 14px; }
  select:hover, button:hover, textarea:hover, input[type="search"]:hover { border-color: var(--line-strong); }
  input[type="search"] { width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 14px; }
  input[type="search"]:focus, textarea:focus { border-color: var(--accent); outline: none; }
  button { padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button.danger { color: var(--danger); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .entry { padding: 16px 18px; border-left: 2px solid var(--accent); }
  .term { font-weight: 600; font-size: 18px; }
  .def { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; }
  .snippet { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line-strong); font-size: 13px; color: var(--muted); font-style: italic; }
  .meta { margin-top: 8px; font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }
  .meta a { color: var(--accent); }
  textarea { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 8px 10px; min-height: 2.6em; resize: vertical; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .row .gap { flex: 1; }
  .empty { color: var(--muted); padding: 32px 0; text-align: center; border: 1px dashed var(--line-strong); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="brand">Arth</p>
  <h1>Saved words</h1>
  <p class="sub">Words you saved from Arth, with the meaning they had where you found them. New to Arth? <a href="guide.html">See the 6-step guide</a>.</p>

  <section class="prefs" aria-label="How Arth explains">
    <label>Explanation style <select id="style"></select></label>
    <label>Language <select id="lang"></select></label>
  </section>

  <input type="search" id="search" placeholder="Search saved words, meanings and notes…" aria-label="Search saved words" />
  <p class="empty" id="empty" hidden></p>
  <ul id="list"></ul>
</main>
<script src="context.js"></script>
<script src="vocab.js"></script>
<script src="words.js"></script>
</body>
</html>
